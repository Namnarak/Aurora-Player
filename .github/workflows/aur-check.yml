name: AUR package checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aur-check.yml'
      - 'packaging/aur/**'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check PKGBUILDs and .SRCINFO
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace \
            archlinux:base-devel bash -Eeuo pipefail -c '
              useradd -m builder
              for pkg in aurora aurora-bin aurora-git; do
                root="/workspace/packaging/aur/$pkg"
                bash -n "$root/PKGBUILD"
                install -d -o builder -g builder "/tmp/aurora-$pkg"
                install -m 0644 -o builder -g builder "$root/PKGBUILD" "/tmp/aurora-$pkg/PKGBUILD"
                runuser -u builder -- bash -c "cd /tmp/aurora-$pkg && makepkg --printsrcinfo" > "/tmp/$pkg.SRCINFO"
                diff -u "$root/.SRCINFO" "/tmp/$pkg.SRCINFO"
              done
            '
